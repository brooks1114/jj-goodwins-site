<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="JJ Goodwins Restaurant & Sports Pub in Center Barnstead, NH. Enjoy famous wings, loaded burgers, craft beer, and a vibrant atmosphere since 1995." />
  <meta name="keywords"
    content="JJ Goodwins, restaurant, sports pub, Center Barnstead, NH, wings, burgers, craft beer, live music, game nights" />
  <meta name="robots" content="index, follow" />
  <title>JJ Goodwins Restaurant & Sports Pub</title>
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <script>
    // Restores the address that 404.html passed along (e.g. /?/menu -> /menu)
    // so links straight to inner pages work on GitHub Pages.
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search.slice(1).split("&").map(function (s) {
          return s.replace(/~and~/g, "&");
        }).join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
